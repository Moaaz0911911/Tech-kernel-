<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — This kernel never popped | kerNEl</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌽%3C/text%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #0e0f13; color: #f3f4f8;
      background-image: radial-gradient(rgba(255,255,255,.06) 2px, transparent 2.5px); background-size: 22px 22px;
    }
    .kernel { font-size: 6rem; display: inline-block; animation: wobble 1.2s ease-in-out infinite; cursor: pointer; user-select: none; }
    .kernel.popped { animation: pop .5s cubic-bezier(.3,1.6,.5,1) forwards; }
    @keyframes wobble { 25% { transform: rotate(-12deg) translateY(-4px); } 75% { transform: rotate(12deg) translateY(-4px); } }
    @keyframes pop { 50% { transform: scale(1.8) rotate(-20deg); } 100% { transform: scale(1.2); } }
    h1 { font-size: clamp(3rem, 12vw, 6rem); margin: 0; line-height: 1; letter-spacing: -.02em; }
    h1 span { display: inline-block; background: #ff2d3d; padding: 0 12px; border-radius: 14px; transform: rotate(-6deg); box-shadow: 5px 5px 0 #ffd23f; }
    p { color: #b8bdcc; max-width: 440px; margin: 16px auto; font-size: 1.1rem; }
    a.btn {
      display: inline-block; margin-top: 10px; padding: 14px 26px; border-radius: 999px; background: #ffd23f; color: #111; font-weight: 800;
      text-decoration: none; border: 3px solid #000; box-shadow: 4px 4px 0 #ff2d3d; transition: transform .2s;
    }
    a.btn:hover { transform: translateY(-3px) rotate(-2deg); }
    small { display: block; margin-top: 18px; color: #6f7588; }
  </style>
</head>
<body>
  <main>
    <div class="kernel" id="kernel" role="button" tabindex="0" aria-label="Poke the kernel">🌽</div>
    <h1>4<span>0</span>4</h1>
    <p>This kernel never popped. The page you’re looking for got eaten, burnt, or was never in the bag to begin with.</p>
    <a class="btn" id="home" href="./">🍿 Back to fresh news</a>
    <small>Tip: poke the kernel. Go on.</small>
  </main>
  <script>
    // On GitHub Pages project sites the first path segment is the repo name.
    (function () {
      var seg = location.pathname.split('/')[1];
      if (/\.github\.io$/.test(location.hostname) && seg) document.getElementById('home').href = '/' + seg + '/';
      var k = document.getElementById('kernel');
      function poke() { k.textContent = '🍿'; k.classList.add('popped'); }
      k.addEventListener('click', poke);
      k.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); poke(); } });
    })();
  </script>
</body>
</html>
